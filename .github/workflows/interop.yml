# Weekly: this conformance suite against the peer VTN's current release, in containers.
#
# A reading not on a schedule decays into a claim. This never fails on the peer's findings — those
# are the output — only when nothing was measured. Read-only, and no secrets: the peer image runs on
# this runner, so the job holds nothing worth taking (interop-schedule/SR-001).
name: Interop

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer:
    name: Against the peer VTN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure
        env:
          PEER: ghcr.io/openleadr/openleadr-rs:latest
          OPENADR_INTEROP_JSON: ${{ runner.temp }}/interop.json
        run: |
          docker pull --platform linux/amd64 "$PEER"
          OPENADR_PEER_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' "$PEER")
          export OPENADR_PEER_IMAGE
          cargo test --locked --all-features --test interop -- --ignored --nocapture
      - name: Summarise
        id: reading
        working-directory: ${{ runner.temp }}
        run: |
          test -s interop.json && test -s interop.html || { echo "Incomplete interop reading"; exit 1; }
          generated=$(jq -er .generated interop.json)
          echo "date=${generated%%T*}" >> "$GITHUB_OUTPUT"
          {
            echo "## Interop — $generated"
            jq -r '"Peer: `" + .target + "`"' interop.json
            echo
            for sev in required recommended extension; do
              jq -r --arg s "$sev" '[.findings[] | select(.severity == $s)] | select(length > 0) |
                "- \($s): \(map(select(.outcome=="passed"))|length) passed, \(map(select(.outcome=="failed"))|length) failed, \(map(select(.outcome=="skipped"))|length) skipped"' interop.json
            done
            echo
            jq -r '.findings[] | select(.outcome == "failed") | "- `\(.id)` (\(.severity)) — \(.title)"' interop.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: interop-${{ steps.reading.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/interop.json
            ${{ runner.temp }}/interop.html
          if-no-files-found: error
      - name: Explain missing reading
        if: failure()
        run: echo "The interop reading was not published. See the failed step for details." >> "$GITHUB_STEP_SUMMARY"
