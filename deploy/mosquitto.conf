# Mosquitto with `mosquitto-go-auth`, for an OpenADR 3.1 VTN's broker.
#
# Mosquitto has no HTTP authentication of its own; `mosquitto-go-auth` is the plug-in that adds it,
# and its `http` backend makes exactly the two calls the VTN answers. See deploy/emqx.conf for what
# the two questions are and why the VTN is the one that answers them.

listener 1883
allow_anonymous false

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_check_prefix false

# The VTN, as the *broker* can reach it. These endpoints are a private contract between the two.
auth_opt_http_host vtn
auth_opt_http_port 3000
auth_opt_http_method POST
auth_opt_http_response_mode json
auth_opt_http_params_mode json

# `mosquitto-go-auth` posts {"username","password","clientid"} and {"username","topic","acc",...};
# the VTN reads `username`, `password`, `clientid`, `topic` and `action`, and ignores the rest.
auth_opt_http_getuser_uri /internal/mqtt/auth
auth_opt_http_aclcheck_uri /internal/mqtt/acl

# There is no superuser. The VTN is the only publisher and it reaches the broker with credentials
# configured here, not through these endpoints — a client that could publish could forge a dispatch
# instruction, which is the worst thing on the list.
auth_opt_http_superuser_uri
