# `cargo deny check` — the licence, advisory and duplication policy.
#
# A utility deploying this has to produce a bill of materials and a licence review anyway. Doing it
# in CI means the answer is a build artefact rather than a spreadsheet somebody assembled by hand
# once, and it means a dependency that changes its licence is a failing build rather than a
# discovery during procurement.
#
# `cargo audit` already runs in CI and covers advisories alone; this covers what it does not:
# licences, banned crates, and the duplicate-version sprawl that makes a bill of materials
# unreadable.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Advisories against a dependency this crate cannot move off, with the reason each is not reachable
# here. An entry is a *decision*, not a silence: it names the crate that pins the vulnerable version,
# says why the vulnerable code path is not entered, and is revisited whenever that crate is upgraded.
# `rumqttc 0.25.1` is the newest release and depends on `rustls-webpki 0.102` directly; the fixes are
# in 0.103.12 and later, which no 0.102.x carries.
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is archived. This crate does not use it - vtn::tls reads PEM through rustls-pki-types PemObject, which is the code rustls-pemfile wraps - and the only remaining edge is rumqttc's. Remove when rumqttc drops it." },
    { id = "RUSTSEC-2026-0098", reason = "URI name constraints were ignored. The same family and the same reasoning as RUSTSEC-2026-0099 below: reachable only after signature verification, only against a misissued certificate, and only on the broker connection. Remove when rumqttc moves to rustls-webpki 0.103.12 or later." },
    { id = "RUSTSEC-2026-0099", reason = "Name constraints accepted a wildcard subject. Reachable only after signature verification and only against a misissued certificate, and only in rumqttc's TLS path - the broker connection, whose root store the operator supplies. Nothing here issues certificates. Remove when rumqttc moves to rustls-webpki 0.103.12 or later." },
    { id = "RUSTSEC-2026-0049", reason = "A certificate with several distributionPoints had all but the first ignored during revocation checking. The same reasoning as RUSTSEC-2026-0104: no CRL is ever supplied to a TLS configuration here, so revocation checking does not run. Remove when rumqttc moves to rustls-webpki 0.103.10 or later." },
    { id = "RUSTSEC-2026-0104", reason = "A panic parsing a certificate revocation list. This crate supplies no CRL to any TLS configuration - vtn::tls builds a WebPkiClientVerifier without one and the MQTT client passes only roots - so the affected parser is never called. Remove when rumqttc moves to rustls-webpki 0.103.13 or later." },
]

[licenses]
# Nothing here is copyleft, and nothing here should become copyleft without somebody deciding to.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `rustls` refuses to choose between compiled-in crypto providers, and this tree can pull both.
# `crate::crypto` names ring explicitly for that reason; banning the other one here is what stops a
# future dependency quietly reintroducing the ambiguity.
deny = [{ name = "aws-lc-rs", reason = "the crate installs the ring provider; see src/crypto.rs" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
