# `cargo deny check` — the licence, advisory and duplication policy.
#
# A utility deploying this has to produce a bill of materials and a licence review anyway. Doing it
# in CI means the answer is a build artefact rather than a spreadsheet somebody assembled by hand
# once, and it means a dependency that changes its licence is a failing build rather than a
# discovery during procurement.
#
# `cargo audit` already runs in CI and covers advisories alone; this covers what it does not:
# licences, banned crates, and the duplicate-version sprawl that makes a bill of materials
# unreadable.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# An entry here is a decision, not a silence: it must name the crate that pins the version, why the
# path is not reachable from the published crate, and what ends the exception. None reaches the
# `openadr` crate itself; both are unmaintained-crate notices, not vulnerabilities.
ignore = [
    # astral-tokio-tar: pinned by testcontainers 0.27, which testcontainers-modules 0.15 (the latest)
    # requires. Dev-dependency only — it unpacks images in `cargo test`, never in the crate. Ends
    # when testcontainers-modules moves to a testcontainers release without it.
    { id = "RUSTSEC-2026-0440", reason = "dev-only, via testcontainers" },
    # unsafe-libyaml: pinned by serde_yaml_ng, which only `xtask` uses, to read the specification's
    # YAML on a contributor's machine and in CI. Ends when xtask moves to a maintained pure-Rust
    # YAML parser.
    { id = "RUSTSEC-2024-0449", reason = "xtask-only, via serde_yaml_ng" },
]

[licenses]
# Nothing here is copyleft, and nothing here should become copyleft without somebody deciding to.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `rustls` refuses to choose between compiled-in crypto providers, and this tree can pull both.
# `crate::crypto` names ring explicitly for that reason; banning the other one here is what stops a
# future dependency quietly reintroducing the ambiguity.
deny = [{ name = "aws-lc-rs", reason = "the crate installs the ring provider; see src/crypto.rs" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
