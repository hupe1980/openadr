## EMQX 5 configuration for an OpenADR 3.1 VTN's broker.
##
## Two things matter here, and both are the VTN's answer rather than the broker's:
##
##   authentication  — the OpenADR access token arrives as the MQTT *password*, which is the
##                     convention the binding names [Notifiers §12.2]. EMQX asks the VTN, so a
##                     revoked credential stops working on MQTT and on REST at the same instant.
##   authorization   — the VTN decides which topics a username may subscribe to. Per-VEN topics
##                     are only privacy if the broker refuses cross-VEN subscriptions, which the
##                     specification requires the VTN to arrange and declines to say how
##                     [Notifiers §9.4].
##
## Point `url` at a VTN address the *broker* can reach. These endpoints are a private contract
## between the two: expose them to the broker and to nothing else.

node.name = "emqx@127.0.0.1"
node.cookie = "openadr-broker"
node.data_dir = "/opt/emqx/data"

listeners.tcp.default.bind = "0.0.0.0:1883"

## --- who are you -----------------------------------------------------------
## `password` is the OpenADR access token; `username` must be the caller's own `clientID`, which is
## what makes the authorization question below answerable without a token.
authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://vtn:3000/internal/mqtt/auth"
    headers { content-type = "application/json" }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    ## The VTN always answers 200 with {"result": "allow"|"deny"}: a non-2xx would be a *broker*
    ## error to EMQX, which then applies its own fallback rather than the decision the VTN made.
    request_timeout = "5s"
    pool_size = 8
  }
]

## --- may you subscribe to this --------------------------------------------
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://vtn:3000/internal/mqtt/acl"
      headers { content-type = "application/json" }
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
      request_timeout = "5s"
      pool_size = 8
    }
  ]
}

## `no_match = deny` is load-bearing. EMQX's default is `allow`, and a VTN whose ACL endpoint is
## briefly unreachable would then hand every VEN every topic — which is the whole of object privacy
## on the push path, undone by a timeout.
