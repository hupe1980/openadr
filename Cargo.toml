[workspace]
members = ["xtask", "tests/aws-lc-consumer"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/hupe1980/openadr"
homepage = "https://hupe1980.github.io/openadr/"
authors = ["The openadr contributors"]

[package]
name = "openadr"
description = "OpenADR 3.1 in Rust: VTN server, VEN runtime, typed client and an open conformance suite"
categories = ["web-programming", "network-programming", "embedded"]
keywords = ["openadr", "energy", "demand-response", "smart-grid", "vtn"]
readme = "README.md"
# Keep the Alliance reference documents and local development tools out of the crate.
exclude = ["concepts/", "specs/", ".specify/", ".agents/", ".claude/", "site/", ".github/", "deploy/", "packaging/", "action.yml", "spec.lock", "inputs.lock"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["std", "tls-ring"]
# Supply a fallback only for roles that already depend on rustls.
tls-ring = ["rustls?/ring"]

# --- foundation -------------------------------------------------------------
# The wire model needs an allocator on embedded targets.
std = [
    "serde/std",
    "serde_json/std",
    "jiff/std",
    "rust_decimal/std",
    "thiserror/std",
]
# --- roles ------------------------------------------------------------------
client = ["std", "dep:reqwest", "dep:rustls", "dep:tokio", "dep:url", "dep:tracing", "dep:futures-util"]
# Registration, event polling and report scheduling.
ven = ["client", "dep:async-trait"]
# The conformance client tests VTNs over HTTP.
conformance = ["client"]
vtn = [
    "std",
    "dep:async-trait",
    "dep:tracing-subscriber",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio",
    "dep:tracing",
    "dep:uuid",
    "dep:http",
    "dep:futures-util",
    "dep:sha2",
    "dep:base64",
    "dep:url",
]

# --- vtn backends -----------------------------------------------------------
# The VTN issues its own tokens: `POST /auth/token`, client secrets hashed with Argon2id.
internal-auth = ["vtn", "dep:jsonwebtoken", "dep:argon2", "dep:rand"]
# Single-process storage.
sqlite = ["vtn", "dep:sqlx", "sqlx/sqlite", "dep:ring"]
# Multiple dispatchers share PostgreSQL outbox leases.
postgres = ["vtn", "dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls-ring", "dep:ring"]
# The VTN validates tokens an external authorization server issued, against its JWKS.
external-auth = ["vtn", "dep:jsonwebtoken", "dep:reqwest", "dep:rustls"]
# Standalone signature verification supports no_std subscribers.
webhook-signature = ["dep:hmac", "dep:sha2"]
webhook = ["vtn", "webhook-signature", "dep:reqwest", "dep:rustls", "dep:rand", "dep:url"]
# MQTT 3.1.1 transport. Add vtn for publishing or ven for subscriptions.
mqtt = [
    "std",
    "dep:tokio",
    "tokio/net",
    "tokio/io-util",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:url",
    "dep:tracing",
]
# HTTPS listener with optional client certificate verification.
tls = ["vtn", "dep:rustls", "dep:tokio-rustls", "dep:hyper", "dep:hyper-util"]
# Local discovery: vtn advertises and ven browses.
mdns = ["std", "dep:mdns-sd", "dep:tracing"]

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive", "rc", "alloc"] }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }
jiff = { version = "1", default-features = false, features = ["serde", "alloc"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["serde"] }
rust_decimal_macros = { version = "1.40.0", default-features = false }
thiserror = { version = "2.0.18", default-features = false }

# role dependencies (all optional)
async-trait = { version = "0.1.89", optional = true }
axum = { version = "0.8.9", optional = true }
tower = { version = "0.5.3", optional = true, features = ["util"] }
tower-http = { version = "0.7.1", optional = true, default-features = false, features = ["trace", "compression-gzip", "compression-br", "limit", "timeout", "request-id", "set-header"] }
tokio = { version = "1.50.0", optional = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, features = ["env-filter"] }
uuid = { version = "1.26.1", optional = true, features = ["v7", "std"] }
http = { version = "1.4.0", optional = true }
url = { version = "2.5.8", optional = true, features = ["serde"] }
futures-util = { version = "0.3.32", optional = true, default-features = false, features = ["std"] }
# The application or the tls-ring fallback installs the process provider.
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["http2", "charset", "rustls-no-provider", "json", "form"] }
# JWT signing and SQL storage encryption use ring independently of the TLS provider.
jsonwebtoken = { version = "9.3.1", optional = true, default-features = false }
argon2 = { version = "0.6.0", optional = true }
rand = { version = "0.9.2", optional = true }
hmac = { version = "0.12.1", optional = true, default-features = false }
sha2 = { version = "0.10.9", optional = true, default-features = false }
base64 = { version = "0.22.1", optional = true }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio"] }
mdns-sd = { version = "0.21.3", optional = true, default-features = false }
# Encrypt stored subscriber credentials in the SQL backends.
ring = { version = "0.17.14", optional = true }
rustls = { version = "0.23.44", optional = true, default-features = false, features = ["std", "tls12"] }
# Root certificates for standalone MQTT over TLS.
webpki-roots = { version = "1.0.9", optional = true }
# TLS transport for the VTN listener and MQTT connections.
tokio-rustls = { version = "0.26.5", optional = true, default-features = false, features = ["tls12", "logging"] }
hyper = { version = "1.11.1", optional = true, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", optional = true, features = ["server-auto", "tokio"] }

[dev-dependencies]
serde_json = { version = "1.0.149", features = ["std", "preserve_order"] }
# Tests decode PEM fixtures to DER because use_pem is disabled.
base64 = "0.22.1"
tokio = { version = "1.50.0", features = ["full"] }
proptest = "1.11.0"
# Reference pattern for duration property tests.
regex = "1.12.3"
# Generate test certificates for TLS handshake tests.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Integration tests start PostgreSQL, EMQX and a peer VTN on demand.
testcontainers = { version = "0.27", features = ["docker-compose"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[[example]]
name = "vtn"
required-features = ["vtn"]

[[example]]
name = "ven"
required-features = ["ven"]

[[bin]]
name = "openadr"
path = "src/bin/openadr/main.rs"
required-features = ["vtn"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
